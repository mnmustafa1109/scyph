# crates/scyph-db/Cargo.toml
[package]
name = "scyph-db"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PgPool builder, migration runner, seed runner, transaction helpers, and dynamic query extensions"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
health = ["dep:scyph-health"]
query = ["dep:scyph-extractors", "dep:strum"]

[dependencies]
scyph-core = { path = "../scyph-core", version = "0.1" }
scyph-health = { path = "../scyph-health", version = "0.1", optional = true }
scyph-extractors = { path = "../scyph-extractors", version = "0.1", optional = true }
strum = { workspace = true, optional = true }
sqlx = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "query_test"
required-features = ["query"]

[[test]]
name = "health_test"
required-features = ["health"]
