# crates/scyph-notify/Cargo.toml
[package]
name = "scyph-notify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Email (lettre/Tera), FCM push, and in-app notification traits for scyph"

[features]
default = ["email"]
email = ["dep:lettre", "dep:tera", "dep:secrecy"]
fcm = ["dep:gcp_auth", "dep:reqwest", "dep:secrecy"]
health = ["dep:scyph-health"]

[dependencies]
scyph-core = { path = "../scyph-core", version = "0.1" }
scyph-health = { path = "../scyph-health", version = "0.1.0", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
gcp_auth = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
