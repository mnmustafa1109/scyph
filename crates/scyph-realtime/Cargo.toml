# crates/scyph-realtime/Cargo.toml
[package]
name = "scyph-realtime"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis pub/sub broadcaster for cross-replica WebSocket fanout"

[features]
default = []
health = ["dep:scyph-health"]

[dependencies]
scyph-core = { path = "../scyph-core", version = "0.1" }
scyph-health = { path = "../scyph-health", version = "0.1", optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }

