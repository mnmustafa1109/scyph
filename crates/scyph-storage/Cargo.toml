# crates/scyph-storage/Cargo.toml
[package]
name = "scyph-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "StorageService trait, multipart file extractor, and S3 implementation"

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
health = ["dep:scyph-health"]
image = ["dep:image"]

[dependencies]
scyph-core = { path = "../scyph-core", version = "0.1" }
scyph-health = { path = "../scyph-health", version = "0.1", optional = true }
axum = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
mime = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }

aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
