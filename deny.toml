# scyph/deny.toml
# Configured for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[graph]
targets = []
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
  # Transitive dependencies required by official AWS SDK (aws-sdk-s3 / aws-config)
  { id = "RUSTSEC-2026-0098", reason = "Transitive dependency rustls-webpki 0.101.7 in aws-sdk-s3 / aws-smithy-http-client" },
  { id = "RUSTSEC-2026-0099", reason = "Transitive dependency rustls-webpki 0.101.7 in aws-sdk-s3 / aws-smithy-http-client" },
  { id = "RUSTSEC-2026-0104", reason = "Transitive dependency rustls-webpki 0.101.7 in aws-sdk-s3 / aws-smithy-http-client" },
  { id = "RUSTSEC-2026-0258", reason = "Transitive dependency h2 0.3.27 in aws-sdk-s3 / hyper 0.14" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
  # Enforce pure Rust / aws-lc-rs TLS ecosystem over native OpenSSL C-bindings
  { name = "openssl", reason = "Use rustls / aws-lc-rs for pure-Rust memory-safe TLS" },
  { name = "openssl-sys", reason = "Use rustls / aws-lc-rs for pure-Rust memory-safe TLS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
