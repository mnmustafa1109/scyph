[package]
name = "scyph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A collection of modular, independently usable Rust crates providing cross-cutting concerns for production Axum backends (auth, RFC 7807 errors, DB, health, telemetry, jobs, and more)."

[features]
default = ["auth", "db", "health"]
auth = ["dep:scyph-auth"]
abac = ["dep:scyph-abac"]
db = ["dep:scyph-db"]
health = ["dep:scyph-health", "scyph-db?/health", "scyph-notify?/health", "scyph-storage?/health"]
notify = ["dep:scyph-notify"]
storage = ["dep:scyph-storage", "scyph-storage/s3"]
s3 = ["storage"]

[dependencies]
scyph-core = { path = "crates/scyph-core", version = "0.1.0" }
scyph-auth = { path = "crates/scyph-auth", version = "0.1.0", optional = true }
scyph-abac = { path = "crates/scyph-abac", version = "0.1.0", optional = true }
scyph-db = { path = "crates/scyph-db", version = "0.1.0", optional = true }
scyph-health = { path = "crates/scyph-health", version = "0.1.0", optional = true }
scyph-notify = { path = "crates/scyph-notify", version = "0.1.0", optional = true }
scyph-storage = { path = "crates/scyph-storage", version = "0.1.0", optional = true }

[workspace]
resolver = "3"
members = [
  ".",
  "crates/scyph-core",
  "crates/scyph-auth",
  "crates/scyph-abac",
  "crates/scyph-db",
  "crates/scyph-health",
  "crates/scyph-notify",
  "crates/scyph-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mnmustafa1109/scyph"
rust-version = "1.98.1"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http2", "json", "tokio", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
chrono = { version = "0.4.26", features = ["serde"] }
tokio = { version = "1.34.0", features = ["full"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
argon2 = "0.6.0"
password-hash = { version = "0.6.1", features = ["rand_core"] }
secrecy = { version = "0.10.3", features = ["serde"] }
moka = { version = "0.12.16", features = ["future"] }
sqlx = { version = "0.9.0", features = [
  "postgres",
  "uuid",
  "chrono",
  "runtime-tokio",
  "tls-rustls-ring",
  "json",
  "rust_decimal",
  "macros",
  "migrate",
] }
cedar-policy = "4.13.0"
lettre = { version = "0.11.23", features = [
  "builder",
  "tokio1",
  "smtp-transport",
  "rustls-tls",
  "tokio1-rustls",
  "tokio1-native-tls",
] }
tera = { version = "2.4.0", features = ["glob_fs"] }
gcp_auth = "0.12.7"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
bytes = "1.12.1"
mime = "0.3.17"
aws-config = "1.12.0"
aws-sdk-s3 = "1.149.0"

# ── Shared release profile for peak performance ──────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
