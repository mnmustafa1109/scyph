[package]
name = "skidblad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Main skidblad crate"

[workspace]
resolver = "3"
members = [".", "crates/skidblad-core", "crates/skidblad-auth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mnmustafa1109/skidblad"
rust-version = "1.98.1"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http2", "json", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
chrono = { version = "0.4.26", features = ["serde"] }
tokio = { version = "1.34.0", features = ["full"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
argon2 = "0.6.0"
password-hash = { version = "0.6.1", features = ["rand_core"] }
secrecy = { version = "0.10.3", features = ["serde"] }
moka = { version = "0.12.16", features = ["future"] }

# ── Shared release profile for peak performance ──────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
